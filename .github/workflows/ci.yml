name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Evaluations
        run: |
          python tests/run_evals.py

      - name: Run API & guardrail tests
        run: |
          pytest tests/ -q

  agent-evals:
    name: Agent Evaluation (live LLM)
    runs-on: ubuntu-latest
    needs: test
    # Non-blocking: runs the live agent eval harness when a GROQ_API_KEY secret
    # is configured, and uploads the report. Does not fail the pipeline.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run agent evaluation harness
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WATTWISE_ENABLE_ADK: "1"
        run: |
          python tests/run_agent_evals.py --out tests/agent_eval_report.md

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: tests/agent_eval_report.md

  deploy:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wattwise-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wattwise-api:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wattwise-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wattwise-frontend:${{ github.sha }}
